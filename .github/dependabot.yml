version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Correções de segurança minor/patch: elegíveis ao auto-merge (ver dependabot-auto-merge.yml).
      security-patch-minor:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
      # Atualizações comuns de devDependencies: agrupadas, revisão manual.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
