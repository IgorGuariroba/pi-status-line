# INVARIANTS:
# - trigger `pull_request` (never pull_request_target): PR code is only scanned, never executed
# - read-only token, checkout without persisted credentials
# - scanner pinned by version + sha256 (never "latest")
# - fixed job `name:`: the ruleset requires this literal check name
# Fallback dos "non-provider patterns" do secret scanning (só existem em organizações).
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (versão e checksum fixos)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Varredura dos commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --redact --no-banner --log-opts="$BASE..$HEAD"
          else
            gitleaks git --redact --no-banner
          fi
